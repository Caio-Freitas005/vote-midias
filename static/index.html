<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoteMídias</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">VoteMídias</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#registerModal">Cadastrar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <div class="container text-center mt-4 mb-4">
            <div class="row justify-content-center">
                <div class="col-lg-3 col-md-4 col-sm-6 mt-2">
                    <div class="card text-bg-success">
                        <div class="card-body">
                            <h5 class="card-title">Total 
                                <i class="bi bi-hand-thumbs-up-fill"></i>
                            </h5>
                            <p id="total-likes" class="card-text fs-4 fw-bold"></p>
                        </div>
                    </div>
                </div>
                <div class="col-lg-3 col-md-4 col-sm-6 mt-2">
                    <div class="card text-bg-danger">
                        <div class="card-body">
                            <h5 class="card-title">Total 
                                <i class="bi bi-hand-thumbs-down-fill"></i>
                            </h5>
                            <p id="total-dislikes" class="card-text fs-4 fw-bold"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="media-container" class="container-fluid mt-5"></div>
    </main>
    <footer class="text-center text-white-50 p-4 mt-auto">
    <div class="container">
        <section class="mb-4">
            <a class="btn btn-outline-light btn-floating m-1" href="https://github.com/Caio-Freitas005" role="button" target="_blank">
                <i class="bi bi-github"></i>
            </a>
            <a class="btn btn-outline-light btn-floating m-1" href="https://www.linkedin.com/in/caio-da-silva-freitas-84b64a285" role="button" target="_blank">
                <i class="bi bi-linkedin"></i>
            </a>
            <a class="btn btn-outline-light btn-floating m-1" href="mailto:caiodasilvafreitas005@gmail.com" role="button">
                <i class="bi bi-envelope-fill"></i>
            </a>
        </section>
        <div class="p-3">
            &copy; 2025 VoteMídias. Feito por 
            <a class="text-white-50" href="https://github.com/Caio-Freitas005">Caio Freitas</a>.
        </div>
    </div>
</footer>
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="errorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Erro na Operação</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="errorToastBody" class="toast-body"></div>
        </div>
    </div>
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-bg-dark">
                <div class="modal-header text-orange">
                    <h1 class="modal-title fs-5" id="registerModalLabel">Cadastrar Nova Mídia</h1>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-orange">
                    <form id="register-form">
                        <div class="mb-3">
                            <label for="title" class="form-label">Título</label>
                            <input type="text" class="form-control" id="media-title" required>
                        </div>
                        <div class="mb-3">
                            <label for="genre" class="form-label">Gênero</label>
                            <input type="text" class="form-control" id="media-genre" required>
                        </div>
                        <div class="mb-3">
                            <label for="image" class="form-label">URL da Imagem</label>
                            <input type="url" class="form-control" id="media-image" placeholder="https://..." required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Descrição</label>
                            <textarea class="form-control" id="media-description" rows="3"></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-gray text-orange" data-bs-dismiss="modal">Fechar</button>
                            <button type="submit" class="btn btn-orange">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="/static/script.js"></script>
</body>
</html>
